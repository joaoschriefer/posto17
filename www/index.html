/* Layout: app de tela cheia em retrato. HUD, cena pixelada, fala, documentos, botões de decisão. */
:root{
  --soot:#14110f; --ink:#0b0908; --paper:#dcd2b0; --paper2:#c4b88f; --olive:#6b7c3f;
  --blood:#b3382f; --brass:#d1a84a; --slate:#2d3b45; --mute:#8a8070; --ok:#7fa650;
  --px:'Press Start 2P',ui-monospace,monospace; --tx:'VT323',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:var(--soot);color:var(--paper);font-family:var(--tx);font-size:20px;touch-action:manipulation}
body{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:6px}
button{font-family:var(--px);color:var(--paper);background:var(--slate);border:3px solid var(--ink);box-shadow:inset -3px -3px 0 rgba(0,0,0,.45),inset 3px 3px 0 rgba(255,255,255,.12);padding:10px 6px;font-size:10px;line-height:1.3;cursor:pointer;image-rendering:pixelated}
button:active{transform:translateY(2px);filter:brightness(1.2)}
button:focus-visible{outline:3px solid var(--brass)}
button:disabled{opacity:.35}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:6px;position:relative}
#hud{display:flex;justify-content:space-between;align-items:center;font-family:var(--px);font-size:9px;gap:6px;padding:4px 2px;color:var(--brass)}
#hud span{white-space:nowrap}
#hud .red{color:var(--blood)}
canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border:3px solid var(--ink);box-shadow:0 0 0 2px var(--slate)}
#scene{aspect-ratio:2/1;flex:none}
#speech{min-height:62px;flex:none;background:var(--ink);border:3px solid var(--slate);padding:6px 10px;font-size:22px;line-height:1.05;display:flex;flex-direction:column;justify-content:center}
#speech b{font-family:var(--px);font-size:8px;color:var(--brass);font-weight:400;margin-bottom:4px;display:block}
#docs{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
#tabs{display:flex;gap:4px;flex:none}
#tabs button{flex:1;padding:7px 2px;font-size:8px;background:var(--ink)}
#tabs button.on{background:var(--olive);color:#fff}
#doc{flex:1;min-height:0;overflow:auto;background:var(--paper);color:#241d12;border:3px solid var(--ink);padding:10px 12px;position:relative;box-shadow:inset 0 0 0 2px var(--paper2)}
#doc h3{font-family:var(--px);font-size:9px;margin:0 0 8px;letter-spacing:.5px;border-bottom:3px double #241d12;padding-bottom:6px;display:flex;justify-content:space-between}
.row{display:flex;justify-content:space-between;gap:10px;padding:2px 4px;font-size:22px;line-height:1;cursor:pointer;border-bottom:1px dotted rgba(36,29,18,.35)}
.row i{font-style:normal;color:#6a5d3f;font-size:18px;flex:none}
.row b{font-weight:400;text-align:right}
.row.hl{background:#f2d34f;outline:2px solid #b3382f}
.seal{font-size:30px;color:#6b1d18;text-align:center;margin-top:6px}
.empty{color:#6a5d3f;text-align:center;padding:30px 0}
.stampmark{position:absolute;right:8px;bottom:8px;font-family:var(--px);font-size:16px;padding:6px 8px;border:4px solid;transform:rotate(-12deg);opacity:.0;pointer-events:none}
.stampmark.show{opacity:.85;animation:st .25s steps(3)}
@keyframes st{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1)}}
#acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none;padding-bottom:2px}
#acts .wide{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.b-ok{background:#43592a}.b-no{background:#7a2620}.b-det{background:#55401b}
.ov{position:absolute;inset:0;background:#0b0908;z-index:20;display:flex;flex-direction:column;gap:8px;padding:8px 2px;overflow:auto}
.ov[hidden]{display:none!important}
.ov h2{font-family:var(--px);font-size:12px;color:var(--brass);margin:4px 0;line-height:1.5}
.ov p,.ov li{font-size:22px;line-height:1.1;margin:0 0 6px}
.ov ul{padding-left:18px;margin:0}
#cs-text{flex:1;min-height:90px;background:var(--ink);border:3px solid var(--slate);padding:10px;font-size:24px;line-height:1.1}
#cs-text b{font-family:var(--px);font-size:9px;color:var(--brass);font-weight:400;display:block;margin-bottom:6px}
.choice{display:block;width:100%;text-align:left;margin-bottom:6px;font-size:9px;padding:10px 8px;line-height:1.5}
.title{font-family:var(--px);font-size:30px;color:var(--paper);line-height:1.1;text-shadow:4px 4px 0 var(--blood);margin:6px 0}
.sub{font-family:var(--px);font-size:9px;color:var(--brass);line-height:1.8}
.bar{height:14px;background:var(--ink);border:3px solid var(--slate);position:relative;margin:4px 0 10px}
.bar>div{height:100%;position:absolute;left:0;top:0}
#track{height:34px;background:var(--ink);border:3px solid var(--slate);position:relative;margin:14px 0}
#zone{position:absolute;top:0;bottom:0;background:rgba(127,166,80,.55);border-left:3px solid var(--ok);border-right:3px solid var(--ok)}
#mark{position:absolute;top:-4px;bottom:-4px;width:6px;background:var(--blood)}
.led{width:100%;border-collapse:collapse;font-size:22px}.led td{padding:2px 0;border-bottom:1px dotted var(--mute)}.led td:last-child{text-align:right}
@media (max-height:700px){#speech{font-size:19px;min-height:52px}.row{font-size:19px}#cs-text{font-size:20px}}

const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function px(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function hex2(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function mix(a,b,t){const A=hex2(a),B=hex2(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}
function sky(c,top,bot,h){for(let y=0;y<h;y+=2)px(c,0,y,160,2,mix(top,bot,y/h))}

function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}return AC}
function tone(f,d,type,v,delay){const c=ac();if(!c||muted)return;try{const t0=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(v||.05,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d+.02)}catch(e){}}

function altName(n){const p=n.split(' ');return pick(NAMES[pick(['M','F'])].filter(x=>x!==p[0]))+' '+p[1]}
function makeApp(id){
  const day=S.day,D=dayDef(),T=dToday(),sp=id?CH[id]:null;
  const sex=sp?sp.sex:pick(['M','F']),hair=sp?sp.hair:pick(Object.keys(HAIR));
  const nac=sp?sp.nac:pick(D.allowed.concat(['KAR','KAR']));
  let name=sp?sp.name:null;
  if(!name){do{name=pick(NAMES[sex])+' '+pick(SURN)}while(WANTED.includes(name))}
  const app={id,sp,name,sex,hair,skin:pick(SKIN),cloth:pick(CLOTH),hat:!sp&&Math.random()<.3,child:!!(sp&&sp.child),enter:0,leave:0,asked:{}};
  if(id==='drenn'){app.cloth='#3a4a3a';app.skin=SKIN[0]}
  app.talk=sp?sp.talk:[{q:"Motivo da viagem?",a:pick(MOT)},{q:"Há quanto tempo está na estrada?",a:pick(EST)}];
  app.pass={nome:name,nasc:fmt(new Date(rnd(1930,1966),rnd(0,11),rnd(1,28))),sexo:sex,cabelo:hair,nac,cid:pick(CITY[nac]),val:addD(T,rnd(40,900))};
  if(day>=2)app.permit={nome:name,motivo:pick(MOTV),num:rnd(1000,9999),ate:addD(T,rnd(2,30)),selo:day>=4?SEAL[day]:null};
  if(day>=3)app.sanit={nome:name,ate:addD(T,rnd(3,60))};
  if(sp){
    if(sp.expired)app.pass.val=addD(T,-sp.expired);
    if(sp.mismatch&&app.permit)app.permit.nome=altName(name);
    if(sp.noPass){app.pass=null;app.permit=null;app.sanit=null}
  }else{
    const av=['expired','nac'];
    if(day>=2)av.push('name','nopermit','permitexp','face');
    if(day>=3)av.push('nosanit','sanitexp');
    if(day>=4)av.push('badseal','wanted');
    const n=Math.random()<.55?(Math.random()<.2?2:1):0,used=[];
    for(let i=0;i<n;i++){const k=pick(av.filter(x=>!used.includes(x)));used.push(k);issue(app,k,T,D,day)}
  }
  return app;
}
function issue(app,k,T,D,day){
  const p=app.pass;
  if(k==='expired')p.val=addD(T,-rnd(1,60));
  else if(k==='nac'){let b=['ORV','DAL','TES'].filter(x=>!D.allowed.includes(x));if(!b.length)b=['TES'];p.nac=pick(b);p.cid=pick(CITY[p.nac])}
  else if(k==='name'&&app.permit)app.permit.nome=altName(app.name);
  else if(k==='nopermit')app.permit=null;
  else if(k==='permitexp'&&app.permit)app.permit.ate=addD(T,-rnd(1,5));
  else if(k==='face')p.cabelo=pick(Object.keys(HAIR).filter(x=>x!==app.hair));
  else if(k==='nosanit')app.sanit=null;
  else if(k==='sanitexp'&&app.sanit)app.sanit.ate=addD(T,-rnd(1,10));
  else if(k==='badseal'&&app.permit)app.permit.selo=pick(SEALS.filter(s=>s!==SEAL[day]));
  else if(k==='wanted'){const nm=pick(WANTED.slice(2));app.name=nm;p.nome=nm;if(app.permit)app.permit.nome=nm;if(app.sanit)app.sanit.nome=nm}
}
function check(app){
  const day=S.day,D=dayDef(),T=dToday(),r=[],p=app.pass;
  if(!p)r.push('Sem passaporte');
  else{if(p.val<T)r.push('Passaporte vencido');if(!D.allowed.includes(p.nac))r.push('Nacionalidade proibida: '+NAT[p.nac]);if(day>=2&&p.cabelo!==app.hair)r.push('Rosto não confere com o passaporte')}
  if(day>=2){if(!app.permit)r.push('Sem permissão de entrada');else{if(p&&app.permit.nome!==p.nome)r.push('Nome diverge entre os documentos');if(app.permit.ate<T)r.push('Permissão vencida');if(day>=4&&app.permit.selo!==SEAL[day])r.push('Selo incorreto na permissão')}}
  if(day>=3){if(!app.sanit)r.push('Sem certificado sanitário');else{if(app.sanit.ate<T)r.push('Certificado sanitário vencido');if(p&&app.sanit.nome!==p.nome)r.push('Nome diverge no certificado')}}
  return{r,wanted:day>=4&&WANTED.includes(app.name)};
}

function decide(kind){

  const A=cur,D=dayDef(),ck=check(A);

  const sm=$('stampmark');sm.textContent={ok:'APROVADO',no:'NEGADO',det:'DETIDO'}[kind];
  sm.style.color=sm.style.borderColor=kind==='ok'?'#2d5a1a':(kind==='no'?'#8a1f18':'#7a5a12');sm.className='stampmark show';
  kind==='ok'?sfx.ok():sfx.no();
  let fb='',col='#d1a84a';
  if(kind===correct){S.right++;S.dayPay+=5;fb='Decisão correta. +$5';if(!A.sp&&kind==='det')S.l+=1}
  else if(!D.finale){
    S.cit++;S.totalCit++;const fine=S.cit>2;if(fine)S.dayFine+=5;
    let why;
    if(kind==='ok')why=(ck.r.concat(ck.wanted?['Procurado pelo Diretório']:[])).join('; ');
    else if(correct==='ok')why='Documentos estavam em ordem';
    else if(correct==='det')why='Procurado: era para DETER';
    else why='Não estava no Boletim';
    fb='CITAÇÃO '+S.cit+': '+why+(fine?' · multa −$5':'');col='#d9604f';setTimeout(sfx.cit,350);
  }
  let line='';const sp=A.sp;
  if(sp){const o=kind==='ok'?sp.ok:(kind==='det'?(sp.det||sp.no):sp.no);if(o){line=o.line;applyFx(o.fx)}S.dec[A.id]=kind}
  S.total++;
  say(A.name,(line?line+'<br>':'')+'<span style="color:'+col+'">'+fb+'</span>');hud();
  setTimeout(()=>{sm.className='stampmark';renderDocs(false);leave(()=>{idx++;nextApp()})},1900);
}

/* ----- set piece: Operação Alvorada ----- */
function runMini(steps,title,done){
  let i=0,ok=0;
  const run=()=>{
    if(i>=steps.length){genHide();return done(ok)}
    const zw=[.30,.22,.15][i]||.15,zs=.12+Math.random()*(.76-zw);
    genShow('<h2>'+title+' · '+(i+1)+'/'+steps.length+'</h2><p>'+steps[i]+'</p><div id="track"><div id="zone" style="left:'+zs*100+'%;width:'+zw*100+'%"></div><div id="mark"></div></div><p style="color:#8a8070">Toque AGORA quando a marca estiver na zona verde.</p><button id="go" class="choice" style="text-align:center;font-size:14px;padding:18px">AGORA!</button><div id="mres" style="min-height:30px;font-size:24px"></div>');
    const mark=$('mark');const start=performance.now();let stopped=false,pos=0;const spd=1.1+i*.45;
    const tick=now=>{if(stopped)return;const ph=((now-start)/1000*spd)%2;pos=ph<1?ph:2-ph;mark.style.left=(pos*97)+'%';requestAnimationFrame(tick)};requestAnimationFrame(tick);
    $('go').onclick=()=>{if(stopped)return;stopped=true;ac();const hit=pos>=zs-.01&&pos<=zs+zw+.01;if(hit){ok++;sfx.good()}else sfx.bad();$('mres').innerHTML=hit?'<span style="color:#7fa650">✔ No tempo certo.</span>':'<span style="color:#d9604f">✖ Errou o tempo.</span>';i++;setTimeout(run,950)};
  };
  run();
}
function setpiece(){
  const plan=!S.flags.betray;
  const pages=plan?[{w:"LYRA (RÁDIO)",t:"Morn, aqui é Lyra. Três passos: corte a energia da guarita, abra o portão e cubra o comboio. Sem pressa e sem erro."}]:
    [{w:"CAP. RUSK",t:"Holofotes, travar o portão, abrir fogo. Eles chegam em minutos. Não me decepcione, Morn."}];
  const steps=plan?["Cortar a energia da guarita","Abrir o portão principal","Cobrir o comboio"]:["Acender os holofotes","Travar o portão","Abrir fogo na torre"];
  showCS(pages,'convoy',()=>runMini(steps,plan?'OPERAÇÃO ALVORADA':'DEFESA DO PORTÃO',n=>{
    S.sp=n;let out;
    if(plan){
      if(n>=2){applyFx({a:3,flag:"convoyOk"});out=[{w:"NARRADOR",t:"O portão cede sem um tiro. Os caminhões entram, faróis apagados. Lyra desce do primeiro, e o rádio nunca fez justiça à sua voz."},{w:"LYRA",t:"Obrigada, inspetor. Hoje, o Diretório inteiro vai prestar contas. Cada família. Cada nome na lista."},{w:"NARRADOR",t:"Rusk é arrastado para fora da guarita, calado, olhando para você. Atrás dele, os homens de Lyra carregam listas. Listas de famílias."}]}
      else{applyFx({a:-1});out=[{w:"NARRADOR",t:"O comboio sofre baixas, mas passa. Lyra sobrevive, e não esquece o seu erro. Rusk é preso entre tiros."},{w:"LYRA",t:"Você me deve uma, Morn. Vou cobrar."}]}
    }else{
      if(n>=2){applyFx({l:4,a:-3});out=[{w:"NARRADOR",t:"Os holofotes revelam os caminhões. Um deles explode. Gritos, depois silêncio. Você ainda ouve."},{w:"CAP. RUSK",t:"O Marechal saberá do seu serviço. Ele sempre sabe."}]}
      else{applyFx({l:-2});out=[{w:"NARRADOR",t:"O comboio rompe o cerco e escapa pela estrada. Rusk lhe lança um olhar frio."},{w:"CAP. RUSK",t:"Falhou uma vez. Não falhe de novo."}]}
    }
    showCS(out,'fire',()=>{S.day++;startDay()});
  }));
}

/* ----- final e epílogos ----- */
function finalChoice(){
  const d=S.dec.drenn,plan=!S.flags.betray;
  if(plan){
    const pages=d==='ok'?[{w:"NARRADOR",t:"O carro do Marechal cruza o portão. Ninguém grita. Lyra não tira os olhos de você."},{w:"LYRA",t:"Deixou ele ir. Tudo bem. Ainda tenho a lista, e você tem as chaves das celas. As famílias do Diretório estão lá dentro."}]:
      [{w:"NARRADOR",t:"Os homens de Lyra arrastam Drenn para fora do carro. Ele não pede perdão: pede um advogado, e riem."},{w:"LYRA",t:"Primeiro ele. Agora os outros. Tenho a lista, e você tem as chaves das celas, Morn. As famílias estão lá dentro."}];
    showCS(pages,'dawn',()=>{
      genShow('<h2>AS CHAVES</h2><p>Crianças e esposas. Gente que nunca empunhou arma.</p><button class="choice" data-e="NOVA">Entregar as chaves e a lista</button><button class="choice" data-e="'+(d==='ok'?'FUMACA':'ALVORADA')+'">Recusar: haverá julgamento justo</button>');
      $('ov-gen').onclick=e=>{const x=e.target.dataset&&e.target.dataset.e;if(x){$('ov-gen').onclick=null;ending(x)}};
    });
  }else{
    if(d!=='ok'){return showCS([{w:"NARRADOR",t:"Você ergue o carimbo contra o Marechal. Rusk faz um sinal quase imperceptível, e os guardas de Drenn se fecham em volta de você."}],'dawn',()=>ending('ULTIMO'))}
    showCS([{w:"VASKO DRENN",t:"Inspetor Morn. O Estado reconhece quem serve. Venha, receba sua medalha diante das câmeras."},{w:"NARRADOR",t:"A medalha pesa menos que o carimbo. Rusk ajusta sua gola, e sua mão está fria."}],'dawn',()=>{
      genShow('<h2>A MEDALHA</h2><p>Todos olham para você.</p><button class="choice" data-e="GUARDA">Aceitar a medalha</button><button class="choice" data-e="ULTIMO">Recusar e sacar a arma de Rusk</button>');
      $('ov-gen').onclick=e=>{const x=e.target.dataset&&e.target.dataset.e;if(x){$('ov-gen').onclick=null;ending(x)}};
    });
  }
}
function extras(){
  let t=S.flags.maraSafe?" Mara reabre a gráfica, desta vez com o nome na porta.":(S.flags.maraLost?" A casa tem uma cadeira vazia, a de Mara.":"");
  if(S.flags.proof)t+=" O envelope de Dmitri chega aos jornais: a bomba da Praça Central tinha assinatura do Estado-Maior.";
  if(S.flags.informante)t+=" Seu nome aparece em uma lista de informantes. Você nunca mais anda sozinho.";
  return t;
}
const END={
 ALVORADA:{t:"A ALVORADA",c:'dawn',p:"Você entrega Drenn para ser julgado diante do povo e recusa as chaves. Lyra rosna, mas sem o portão e sem as celas, não há purga. Karvânia vive meses de caos e depois de eleições."},
 NOVA:{t:"A NOVA BANDEIRA",c:'fire',p:"Lyra cumpre sua lista. As fronteiras fecham de novo, com outro nome no cartaz. No Posto 17, uma nova ordem manda carimbar NEGADO em quase todos. Você olha o carimbo e entende que só mudou a cor da tinta."},
 FUMACA:{t:"FUMAÇA",c:'night',p:"Drenn atravessa a fronteira e some no mundo. Sem ele, o regime se desfaz em semanas, mas as dívidas ficam. Você nunca saberá se o carimbo de hoje salvou ou condenou o país."},
 GUARDA:{t:"O GUARDA FIEL",c:'city',p:"Você recebe a medalha. Rusk é promovido a coronel, e você a capitão. O portão continua aberto a quem paga e fechado a quem chora."},
 ULTIMO:{t:"O ÚLTIMO CARIMBO",c:'fire',p:"O tiro acerta o retrato do Marechal na parede, e a guarda reage. Seu último carimbo foi o do “nunca mais”. A notícia corre, e muita gente aprende seu nome: Aleksei Morn."}
};
function ending(id){
  const E=END[id];clearInterval(typeTimer);
  showCS([{w:"FIM",t:E.p+extras()}],E.c,()=>{
    try{localStorage.removeItem('posto17')}catch(e){}
    genShow('<div class="sub">FINAL</div><div class="title" style="font-size:22px">'+E.t+'</div><table class="led"><tr><td>Pessoas atendidas</td><td>'+S.total+'</td></tr><tr><td>Citações no total</td><td>'+S.totalCit+'</td></tr><tr><td>Lealdade ao Diretório</td><td>'+S.l+'</td></tr><tr><td>Laços com a Aurora</td><td>'+S.a+'</td></tr></table><p style="color:#8a8070">Existem 5 finais. Suas escolhas nas noites decidem quase todos.</p><button class="choice" id="again" style="text-align:center">JOGAR DE NOVO</button>');
    $('again').onclick=()=>{genHide();title()};
  });
}

/* ----- título ----- */
function title(){
  S=newState();cur=null;queue=[];renderDocs(false);hud();say('','Posto 17. Fronteira da República de Karvânia.');
  const sv=load();
  genShow('<div class="sub">REPÚBLICA DE KARVÂNIA · 1987</div><div class="title">POSTO<br>17</div><p>Você é o inspetor Aleksei Morn. Cada carimbo decide quem entra, quem some e quem sobra de um país à beira da revolução.</p><p style="color:#8a8070">Compare os documentos com o Manual, aprove, negue ou detenha. Ficção com violência e temas políticos.</p><button class="choice" id="new" style="text-align:center;font-size:12px;padding:14px">NOVO JOGO</button>'+(sv?'<button class="choice" id="cont" style="text-align:center;font-size:12px;padding:14px">CONTINUAR (DIA '+sv.day+')</button>':''));
  $('new').onclick=()=>{ac();music(!muted);genHide();showCS([
    {w:"NARRADOR",t:"Karvânia, 1987. Há doze anos o Marechal Vasko Drenn governa pelo Diretório. O pão é racionado, as rádios têm um só canal e a fronteira tem um único olhar: o seu."},
    {w:"NARRADOR",t:"Você é Aleksei Morn, inspetor do Posto 17. Sua irmã Mara imprime panfletos escondida. Seu carimbo decide quem vive e quem desaparece."},
    {w:"NARRADOR",t:"Regra número um do Diretório: o carimbo nunca erra. Quem erra, paga."}],'city',()=>startDay())};
  if(sv)$('cont').onclick=()=>{ac();music(!muted);S=sv;genHide();startDay()};
}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'MUDO':'SOM';music(!muted)};

function loop(now){
  const dt=Math.min(50,now-last);last=now;
  if(cur){
    if(cur.enter<1){cur.enter=Math.min(1,cur.enter+dt/900);stepT+=dt;if(stepT>230){stepT=0;sfx.step()}
      if(cur.enter>=1&&cur.onEnter){const f=cur.onEnter;cur.onEnter=null;f()}}
    if(cur&&cur.leaving){cur.leave+=dt/500;if(cur.leave>=1){const f=cur.onLeft;cur=null;f&&f()}}
  }
  drawBooth(now);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
title();
</script>
