name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Configure portrait and immersive fullscreen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          # Set portrait on the launcher activity without duplicating the attribute.
          text = re.sub(r'<activity(?![^>]*android:screenOrientation)[^>]*>', lambda m: m.group(0)[:-1] + ' android:screenOrientation="portrait">', text, count=1)
          manifest.write_text(text)
          styles = Path('android/app/src/main/res/values/styles.xml')
          text = styles.read_text()
          if 'android:windowFullscreen' not in text:
              text = text.replace('</style>', '    <item name="android:windowFullscreen">true</item>\n    </style>')
          styles.write_text(text)
          PY
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: posto17-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
